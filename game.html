<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Facility — Gameplay</title>
<style>html,body{margin:0;background:#050b0e;color:#d1f3f4;font:16px system-ui}#status{position:fixed;inset:0;display:grid;place-items:center;padding:2rem;text-align:center}</style></head><body><div id="status">Loading The Facility…</div>
<script>
(async function boot(){
const status=document.getElementById('status');
try {
 const res=await fetch('./game-core.html',{cache:'no-store'});
 if(!res.ok)throw Error('Game source returned '+res.status);
 let html=await res.text();
 const changes=[
  ['(stf>.88&&Math.abs(touchMove.x+padMove.x)<.5)','false'],
  ['pl.sta-dt/5.2','pl.sta-dt/8.0'],
  ['F.staT=1.1','F.staT=.65'],
  ['ml>.1?.11:.19','ml>.1?.16:.24'],
  ['pl.sta>.42','pl.sta>.30']
 ];
 for(const [before,after] of changes){
  if(!html.includes(before))throw Error('Gameplay source changed; missing '+before);
  html=html.replace(before,after);
 }
 // Apply all changes to the original gameplay before the game's own scripts execute.
 document.open();
 document.write(html);
 document.close();
} catch(err) {
 console.error('The Facility gameplay startup failed:',err);
 status.textContent='Could not load Facility gameplay: '+err.message;
}
})();
</script></body></html>
